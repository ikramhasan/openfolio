name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec next typegen && pnpm exec tsc --noEmit

      # Pushes convex/ to a preview backend named after this PR's branch and
      # writes NEXT_PUBLIC_CONVEX_URL / NEXT_PUBLIC_CONVEX_SITE_URL into
      # .env.local. No --cmd here: the backend must have content:nav (etc.)
      # available *before* `next build` runs generateStaticParams, which
      # queries it. Reusing the deployment (--preview-name, not
      # --preview-create) keeps this preview's data across pushes to the
      # same PR instead of wiping it every run.
      - name: Push Convex functions to preview deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: npx convex deploy --preview-name "pr-${{ github.event.pull_request.number }}"

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Convex needs SITE_URL to validate auth redirects, but the preview
      # Vercel URL isn't known until the deploy above finishes. Point this
      # preview backend's SITE_URL at it now that we have it.
      - name: Point preview backend at its Vercel URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          npx convex env set SITE_URL "${{ steps.deploy.outputs.url }}" \
            --deployment "pr-${{ github.event.pull_request.number }}" \
            --force

      - name: Health check
        id: health
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          code="000"

          for attempt in {1..6}; do
            echo "Health check attempt $attempt"

            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "$DEPLOY_URL/") || code="000"

            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "status=up ($code)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "status=down ($code)" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Comment preview URL on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deployment
          message: |
            ${{ steps.health.outputs.status == 'up' && '✅' || '⚠️' }} Preview: ${{ steps.deploy.outputs.url }}
            Health: ${{ steps.health.outputs.status || 'not checked' }}

      - name: Set commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const health = "${{ steps.health.outputs.status }}";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: health === "up" ? "success" : "failure",
              target_url: "${{ steps.deploy.outputs.url }}",
              description: health === "up" ? "Preview deployment ready" : "Preview deployment failed health check",
              context: "vercel/preview",
            });
